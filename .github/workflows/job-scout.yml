name: Job Scout

on:
  schedule:
    # GitHub cron is UTC. IST = UTC+5:30.
    - cron: "30 2 * * *"    # 08:00 IST
    - cron: "30 12 * * *"   # 18:00 IST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no email, history not saved)"
        type: boolean
        default: false

permissions:
  contents: write   # commit data/seen_jobs.json back for historical dedup

concurrency:
  group: job-scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Run Job Scout
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python -m job_scout ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Upload digest preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_id }}
          path: out/digest.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit seen-jobs history
        if: success() && !inputs.dry_run
        run: |
          git config user.name "job-scout[bot]"
          git config user.email "job-scout[bot]@users.noreply.github.com"
          git add data/seen_jobs.json
          if git diff --cached --quiet; then
            echo "No history changes"
          else
            git commit -m "chore: update seen jobs [skip ci]"
            for i in 1 2 3; do
              git pull --rebase --quiet && git push && break
              sleep $((i * 5))
            done
          fi
