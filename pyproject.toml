[project]
name = "job-scout"
version = "1.0.0"
description = "Scrape PM roles from LinkedIn, Hacker News, X, Wellfound and HasJob, filter with Gemini, email a digest."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
job-scout = "job_scout.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["job_scout*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
